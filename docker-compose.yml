services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insightiq_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_PATH=/data/insightiq.db
      - DATA_DIR=/data
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
    volumes:
      - insightiq_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: insightiq_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  insightiq_data:
    driver: local
